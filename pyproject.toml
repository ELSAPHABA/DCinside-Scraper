[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcinside-scraper"
version = "0.1.0"
description = "DCinside scraper core contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dcinside_scraper"]
