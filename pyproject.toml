[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcinside-scraper"
version = "0.1.0"
description = "DCinside scraper core contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4,<5",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.34,<2",
]
postgres = [
  "psycopg[binary]>=3,<4",
]
mcp = [
  "mcp>=1,<2",
]
analysis = [
  "polars>=1,<2",
]
test = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
]

[project.scripts]
dcinside-scraper = "dcinside_scraper.adapters.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: optional live network smoke tests",
  "docker: optional Docker smoke tests",
  "garage: optional Garage/S3-compatible smoke tests",
  "postgres: optional PostgreSQL smoke tests",
  "mcp: optional MCP smoke tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dcinside_scraper"]
